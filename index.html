<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vogels van Costa Rica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: veldnotitieboek. Score bovenaan, daaronder een doorzoekbaar raster van soortkaarten met twee grote knoppen (gehoord / gezien). */
:root{
  --bg:#eef2e9; --surface:#fbfcf8; --surface2:#e3eadb; --fg:#14281f; --muted:#52645a; --line:#c9d6c2;
  --accent:#0b6b55; --accent-fg:#ffffff;
  --heard:#1c6f9c; --seen:#2f7a2a; --both:#9a6200; --special:#a2410e; --on-state:#ffffff;
  --photo-bg:#d5dfcd;
  --ff-d:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1713; --surface:#14241d; --surface2:#1b3027; --fg:#e4eee7; --muted:#9db3a6; --line:#2a4036;
    --accent:#4cc9a6; --accent-fg:#06231a;
    --heard:#6bb8e8; --seen:#7fcf6f; --both:#f0b84a; --special:#f09a6b; --on-state:#08140f;
    --photo-bg:#1e3329; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--ff-b);
  padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--ff-d);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kop en score */
header.top{padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:8px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;letter-spacing:-.01em}
